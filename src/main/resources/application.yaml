spring:
  application:
    name: java-21-springboot-template
  
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}

frontend:
  url: ${FRONTEND_URL}

cookie:
  secure: ${COOKIE_SECURE:true}

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: None
        secure: true